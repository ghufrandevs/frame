services:

  # ===== SQL Server database =====
  frame-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: frame-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - frame-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ===== Mailpit: catches all outgoing emails for testing =====
  frame-mail:
    image: axllent/mailpit:latest
    container_name: frame-mail
    ports:
      - "${MAIL_UI_PORT}:8025"
      - "${MAIL_SMTP_PORT}:1025"
    restart: unless-stopped

  # ===== Backend API (.NET) =====
  # Same settings as user-secrets, from .env; "Section:Key" becomes "Section__Key".
  # Inside Docker, other containers are reached by name (frame-db, frame-mail), not localhost.
  frame-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frame-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT}
      ConnectionStrings__Default: "Server=frame-db,1433;Database=FrameDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__FullName: ${ADMIN_FULLNAME}
      Smtp__Host: frame-mail
      Smtp__Port: "1025"
    ports:
      - "${API_PORT}:8080"
    volumes:
      - ./backend/Frame.Api/logs:/app/logs
    depends_on:
      frame-db:
        condition: service_healthy
      frame-mail:
        condition: service_started
    restart: unless-stopped

  # ===== Customer website (static HTML/CSS/JS) =====
  frame-web:
    image: nginx:alpine
    container_name: frame-web
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  # ===== Admin panel (static HTML/CSS/JS), separate site =====
  frame-admin:
    image: nginx:alpine
    container_name: frame-admin
    ports:
      - "${ADMIN_PORT}:80"
    volumes:
      - ./admin:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  frame-db-data: