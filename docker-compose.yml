services:

  # ===== SQL Server database =====
  frame-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: frame-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - frame-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ===== Mailpit: catches all outgoing emails for testing =====
  frame-mail:
    image: axllent/mailpit:latest
    container_name: frame-mail
    ports:
      - "${MAIL_UI_PORT}:8025"
      - "${MAIL_SMTP_PORT}:1025"
    restart: unless-stopped

volumes:
  frame-db-data: